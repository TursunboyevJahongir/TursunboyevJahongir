name: Rotate profile illustrations

on:
  schedule:
    # Offset from the busiest minute of the hour. GitHub may delay scheduled runs.
    - cron: '17 * * * *'

concurrency:
  group: profile-illustration-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check rotation behavior
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Choose new illustrations
        run: python3 -B .github/scripts/rotate_illustrations.py

      - name: Commit only the README update
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'chore: rotate profile illustrations' --only -- README.md
          git push origin "HEAD:${PROFILE_BRANCH}"
